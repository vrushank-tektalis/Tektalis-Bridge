version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: tektalis_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tektalis_bridge
    volumes:
      - mongo_data:/data/db
    networks:
      - tektalis_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tektalis_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=tektalis_bridge
      - SECRET_KEY=tektalis-bridge-super-secret-production-key-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80"]
      - FIRST_ADMIN_EMAIL=admin@tektalis.com
      - FIRST_ADMIN_PASSWORD=Admin@123456
      - FIRST_ADMIN_NAME=System Admin
      - AI_API_URL=https://generativelanguage.googleapis.com/v1beta
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=gemini-2.0-flash
    depends_on:
      - mongodb
    networks:
      - tektalis_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tektalis_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tektalis_network

volumes:
  mongo_data:
    driver: local

networks:
  tektalis_network:
    driver: bridge
